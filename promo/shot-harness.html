<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1b22" />
    <link rel="stylesheet" href="../style.css" />
    <title>Sudoku - screenshot harness</title>
  </head>
  <body>
    <!-- =====================================================================
         Screenshot harness za promo/itch/*.png. Vidi promo/itch/README.md.

         Markup se NE duplicira - povlaci se iz pravog index.html i ubacuje
         u ovu stranicu. Prijasnja verzija je imala vlastitu kopiju <body>-ja
         i zato je istrunula: nabrajala je 6 varijanti dok ih je igra imala
         20, pa je screenshot menija pokazivao igru od prije godinu dana.
         Sve sto ovdje treba stajati je SEED stanja, ne UI.

         Parametri:
           ?v=killer,thermo   varijante partije u tijeku (prazno = classic)
           ?menu=killer,x     umjesto partije otvori New game meni i ukljuci
                              te varijante (koristi pravi klik, pa se vidi i
                              upozorenje koje app sam prikaze na dvije)
         ===================================================================== -->
    <script>
      (async () => {
        const qs = new URLSearchParams(location.search);

        // 1. Pravi DOM iz index.html. innerHTML NE izvrsava <script>, pa se
        //    engine ucitava rucno ispod (i s tocnim relativnim putanjama).
        const html = await (await fetch("../index.html")).text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        doc.body.querySelectorAll("script").forEach((s) => s.remove());
        document.body.insertAdjacentHTML("afterbegin", doc.body.innerHTML);

        const load = (src) =>
          new Promise((res, rej) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = res;
            s.onerror = rej;
            document.body.appendChild(s);
          });

        // metrics.js se NAMJERNO ne ucitava - render za store ne salje evente.
        await load("../solver.js");
        await load("../sudoku.js");

        // 2. Prava slagalica + uvjerljivo stanje usred rjesavanja. Sinkrono
        //    (bez workera), pa app.js zatekne gotovo stanje i samo ga iscrta.
        const variants = (qs.get("v") || "").split(",").filter(Boolean);
        let g;
        try {
          g = Sudoku.generate("normal", variants);
        } catch (e) {
          g = Sudoku.generate("normal", []);
        }
        const { puzzle, solution } = g;
        const values = puzzle.slice();
        const notes = Array.from({ length: 81 }, () => []);
        const colors = Array.from({ length: 81 }, () => []);
        const empty = [];
        for (let i = 0; i < 81; i++) if (puzzle[i] === 0) empty.push(i);
        const pick = (arr, n, step) => {
          const out = [];
          for (let k = 0; k < arr.length && out.length < n; k += step) out.push(arr[k]);
          return out;
        };
        // Tocni upisi (renderiraju se plavo, nikad crveno).
        pick(empty, 11, 3).forEach((i) => (values[i] = solution[i]));
        // Klasicni kandidati za uvjerljive biljeske.
        const cands = (i) => {
          const r = Math.floor(i / 9),
            c = i % 9,
            br = Math.floor(r / 3) * 3,
            bc = Math.floor(c / 3) * 3;
          const used = new Set();
          for (let k = 0; k < 9; k++) {
            used.add(values[r * 9 + k]);
            used.add(values[k * 9 + c]);
          }
          for (let a = 0; a < 3; a++)
            for (let b = 0; b < 3; b++) used.add(values[(br + a) * 9 + bc + b]);
          const out = [];
          for (let d = 1; d <= 9; d++) if (!used.has(d)) out.push(d);
          return out;
        };
        const stillEmpty = empty.filter((i) => values[i] === 0);
        pick(stillEmpty, 5, 2).forEach((i) => (notes[i] = cands(i).slice(0, 3)));
        if (stillEmpty.length > 3) colors[stillEmpty[3]] = [4];
        if (stillEmpty.length > 7) colors[stillEmpty[7]] = [2, 6];
        // Odabir na sredisnjoj popunjenoj celiji -> highlight retka/stupca/kutije.
        const filled = [];
        for (let i = 0; i < 81; i++) if (values[i]) filled.push(i);
        const at = (i) => (filled.includes(i) ? i : null);
        const sel = at(40) ?? at(31) ?? at(49) ?? filled[Math.floor(filled.length / 2)];

        // `clues` mora ici cijeli i pod tim imenom. Stara verzija harnessa je
        // spremala samo `regions` na vrhu stanja (oblik od prije clues objekta),
        // pa bi svaka oznaka novija od jigsawa - kavezi, tube, linije, pojas -
        // jednostavno nedostajala na slici.
        const state = {
          puzzle,
          solution,
          values,
          notes,
          colors,
          difficulty: "normal",
          variants: g.variants || variants,
          clues: g.clues || null,
          techniques: g.techniques || [],
          gameId: "",
          playMs: 0,
          moves: 0,
          hints: 0,
          selected: sel,
          multi: [],
          notesMode: false,
          activeNote: null,
          colorMode: false,
          solved: false,
          startPending: false,
        };
        try {
          localStorage.setItem("sudoku-game-v2", JSON.stringify(state));
        } catch (e) {
          /* screenshot bez seeda je i dalje bolji od pada */
        }

        // 3. Igra. init() se u app.js zove odmah, a DOM je vec tu.
        await load("../app.js");

        // Verzija se u igri cita iz ./package.json - odavde bi to bio 404, pa
        // se upise rucno da slika nosi tocnu oznaku builda.
        try {
          const p = await (await fetch("../package.json")).json();
          const el = document.getElementById("app-version");
          if (el && p.version) el.textContent = "v" + p.version;
        } catch (e) {
          /* bez verzije slika je i dalje upotrebljiva */
        }

        // 4. Meni mod: otvori PRAVI New game meni i klikni tražene varijante,
        //    pa se vidi i upozorenje koje app sam doda kad su dvije aktivne.
        const menu = qs.get("menu");
        if (menu) {
          document.getElementById("new-btn").click();
          menu
            .split(",")
            .filter(Boolean)
            .forEach((v) => {
              const b = document.querySelector('.variant-row[data-variant="' + v + '"]');
              if (b) b.click();
            });
        }
        document.documentElement.dataset.shotReady = "1";
      })();
    </script>
  </body>
</html>
